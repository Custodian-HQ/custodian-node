name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Trusted publishing needs npm 11.5.1 or later
        run: npm install -g npm@^11.5.1
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: The tag must match the package and API spec versions
        run: node scripts/check-version.mjs "$GITHUB_REF_NAME"
      - run: npm audit signatures
      - run: npm pack --dry-run
      - name: Stage the package (no token, npm trusts this workflow)
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-*)
              # npm 11 needs a tag for a prerelease. 1.0.0-beta.2 goes to "beta", 1.0.0-rc.1 to "rc". Never "latest".
              tag="${version#*-}"; tag="${tag%%.*}"
              case "$tag" in latest|"") echo "bad prerelease tag in $version"; exit 1 ;; esac
              npm stage publish --access public --tag "$tag" ;;
            *) npm stage publish --access public ;;
          esac
          echo "::notice::Staged $version. It is not public until a maintainer runs: npm stage list, then npm stage approve <stage-id>"
      - name: GitHub release
        run: |
          case "$GITHUB_REF_NAME" in *-*) flag=--prerelease ;; *) flag= ;; esac
          gh release create "$GITHUB_REF_NAME" --generate-notes $flag
        env:
          GH_TOKEN: ${{ github.token }}
